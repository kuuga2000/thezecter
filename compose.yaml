name: thezecter-workspace

services:
  zect:
    image: thezecter-dev:latest
    container_name: thezecter-dev
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    user: thezecter
    group_add:
      - "${DOCKER_GID:-1001}"
    command: sleep infinity
    volumes:
      - .:/workspace
      - ./.bashrc:/home/thezecter/.bashrc
      - /var/run/docker.sock:/var/run/docker.sock
      - codex-data:/home/thezecter/.codex
      - claude-data:/home/thezecter/.claude
      - copilot-data:/home/thezecter/.copilot

  valkey:
    image: valkey/valkey:latest
    container_name: thezecter-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey-data:/data

volumes:
  # Uncomment external: true to use an existing volume managed outside this project.
  # External volumes must be created before running docker compose up.
  codex-data:
    name: codex-data
    # external: true
  claude-data:
    name: claude-data
    # external: true
  copilot-data:
    name: copilot-data
    # external: true
  valkey-data:
